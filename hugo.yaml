# Hugo configuration file
title: Accorderly
baseURL: https://accorderly.com/
defaultContentLanguage: en

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Book a call
      url: https://cal.eu/accorderly
      weight: 2

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/accorderly-icon.svg
      width: 28

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/chartpath/accorderly/edit/main/content"

  description: "Solo tech consulting from Chris Hart in Moncton, New Brunswick. Continuous Discovery, Design, and DevOps run in parallel, plus AI systems that can explain their answers."
  images:
    - images/og-card.png
