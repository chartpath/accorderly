# Hugo configuration file
title: Accorderly
baseURL: https://accorderly.com/
defaultContentLanguage: en

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Docs
      pageRef: /docs
      weight: 2
    - name: Contact
      pageRef: /contact
      weight: 3

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/accorderly-icon.svg
      width: 28

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/chartpath/accorderly/edit/main/content"
